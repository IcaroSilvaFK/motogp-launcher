[package]
name = "motogp-launcher"
description = "MotoGP Mod Launcher (camada de interface Tauri)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "motogp_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
motogp-domain = { path = "../crates/domain" }
motogp-application = { path = "../crates/application" }
motogp-infrastructure = { path = "../crates/infrastructure" }

[dev-dependencies]
cucumber = "0.21"
futures = "0.3"
serde_json = "1"

# Runner BDD (cucumber) sem o harness padrão do libtest.
[[test]]
name = "features"
harness = false
