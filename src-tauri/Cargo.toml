[package]
name = "motogp-launcher"
description = "MotoGP Mod Launcher (Tauri interface layer)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "motogp_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
motogp-domain = { path = "../crates/domain" }
motogp-application = { path = "../crates/application" }
motogp-infrastructure = { path = "../crates/infrastructure" }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
cucumber = "0.21"
futures = "0.3"
serde_json = "1"
tempfile = "3"
tauri = { version = "2", features = ["test"] }

# BDD runner (cucumber) without the default libtest harness.
[[test]]
name = "features"
harness = false
