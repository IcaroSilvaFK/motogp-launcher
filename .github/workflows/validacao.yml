name: Validation (TDD + BDD + Clean Architecture)

on:
  pull_request:
    branches: [dev, qas, main]
  push:
    branches: [dev, qas, main]

# The scaffold (Cargo.toml, package.json, tauri.conf.json) is part of the repository,
# so the required jobs below always run and are never skipped.
jobs:
  rust:
    name: Rust core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      # Node + pnpm are needed by the interface BDD scenarios (they run the real ESLint)
      # and by the coverage gate script.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - name: BDD scenarios
        run: cargo test --workspace --test features
      - name: Architecture (Cargo dependencies point inward)
        run: cargo test -p motogp-launcher --test architecture
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage (>= 90% per core crate, >= 80% overall)
        shell: bash
        run: |
          cargo llvm-cov --workspace --json --summary-only --output-path coverage-rust.json \
            --ignore-filename-regex '(^|[\\/])\.worktrees[\\/]|src-tauri[\\/]src[\\/](main|bootstrap)\.rs'
          node scripts/check-rust-coverage.mjs coverage-rust.json

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm prettier --check .
      - name: Lint + architecture boundaries
        run: pnpm lint
      - name: Types
        run: pnpm tsc --noEmit
      - name: Tests (unit + BDD) with coverage
        run: pnpm test --coverage

  build-windows:
    name: Build Windows installer
    needs: [rust, frontend]
    # Only builds the installer after the code lands on an environment branch (not on PRs)
    if: ${{ github.event_name == 'push' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # dev/qas: builds the installer and publishes it as a pipeline artifact
      - name: Build (dev/qas)
        if: ${{ github.ref_name != 'main' }}
        uses: tauri-apps/tauri-action@v0
        env:
          # Only used when bundle.createUpdaterArtifacts is enabled (auto-update issue)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles nsis,msi

      - name: Upload artifact
        if: ${{ github.ref_name != 'main' }}
        uses: actions/upload-artifact@v4
        with:
          name: motogp-launcher-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          retention-days: 30
          if-no-files-found: error

      # main (production): builds the installer and publishes it to a GitHub Release + latest.json (consumed by the app updater)
      - name: Build + Release (main)
        if: ${{ github.ref_name == 'main' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          uploadUpdaterJson: true
          args: --bundles nsis,msi
          tagName: v__VERSION__
          releaseName: 'MotoGP Launcher v__VERSION__'
          releaseBody: 'Download the setup `.exe` or the `.msi` below.'
          releaseDraft: false
          prerelease: false
