[package]
name = "community-infrastructure"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
community-domain = { path = "../domain" }
community-application = { path = "../application" }
async-trait = "=0.1.92"
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
getrandom = "=0.3.4"
sha2 = "=0.10.9"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
serde_json = "=1.0.154"
tracing = "=0.1.44"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net"] }
axum = "=0.8.9"
