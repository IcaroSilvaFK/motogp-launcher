[package]
name = "community-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "motogp-community"
path = "src/main.rs"

[dependencies]
community-domain = { path = "../crates/domain" }
community-application = { path = "../crates/application" }
community-infrastructure = { path = "../crates/infrastructure" }
async-trait = "=0.1.92"
axum = "=0.8.9"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "=0.6.11", features = ["trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "=0.1.5"
tower = { version = "=0.5.3", features = ["util"] }
cucumber = "=0.21.1"
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite"] }

# BDD runner (cucumber) without the default libtest harness.
[[test]]
name = "features"
harness = false

[[test]]
name = "stars_features"
harness = false

[[test]]
name = "comments_features"
harness = false
